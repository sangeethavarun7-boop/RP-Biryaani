{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <h1 class="text-center text-danger mb-5">
        👨‍💼 Admin Panel
    </h1>

    <table class="table table-bordered table-striped shadow">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Food</th>
                <th>Quantity</th>
                <th>Address</th>
                <th>Message</th>
            </tr>

        </thead>

        <tbody>

            {% for order in orders %}

            <tr>

                <td>{{ order[0] }}</td>
                <td>{{ order[1] }}</td>
                <td>{{ order[2] }}</td>
                <td>{{ order[3] }}</td>
                <td>{{ order[4] }}</td>
                <td>{{ order[5] }}</td>
                <td>{{ order[6] }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
