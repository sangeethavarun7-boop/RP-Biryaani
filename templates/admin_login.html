{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="card shadow mx-auto p-4"
         style="max-width: 450px;">

        <div class="text-center mb-4">

            <div style="font-size: 55px;">
                🔐
            </div>

            <h2 class="text-danger">
                Admin Login
            </h2>

            <p class="text-muted">
                RP Biryaani Management Panel
            </p>

        </div>

        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    autocomplete="username"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    autocomplete="current-password"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-danger w-100">

                🔐 Login

            </button>

        </form>

    </div>

</div>

{% endblock %}
